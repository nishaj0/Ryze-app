name: Build & Release Android

on:
  push:
    tags:
      - "v*"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: expo-app/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        id: build
        run: |
          BUILD_OUTPUT=$(eas build --platform android --profile release --non-interactive --json)
          BUILD_ID=$(echo "$BUILD_OUTPUT" | jq -r '.[0].id')
          ARTIFACT_URL=$(echo "$BUILD_OUTPUT" | jq -r '.[0].artifacts.buildUrl')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "artifact_url=$ARTIFACT_URL" >> $GITHUB_OUTPUT

      - name: Download APK
        run: |
          curl -L -o ryze-${{ github.ref_name }}.apk "${{ steps.build.outputs.artifact_url }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryze-android-apk
          path: expo-app/ryze-${{ github.ref_name }}.apk

  release:
    name: Create GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ryze-android-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ryze-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
